name: Trendyol Collector Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "collectors/trendyol.py"
      - "requirements.txt"
      - ".github/workflows/trendyol-test.yml"

jobs:
  test-trendyol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Trendyol collector
        run: python collectors/trendyol.py

      - name: Show result
        if: always()
        run: |
          echo "--- trendyol_products.json ---"
          if [ -f trendyol_products.json ]; then
            cat trendyol_products.json
          else
            echo "No output file generated"
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendyol-products
          path: trendyol_products.json
          if-no-files-found: warn
